name: Deploy API

# Every push to main that touches the API deploys it to Cloudflare Workers.
on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/protocol/**"
      - "packages/crypto/**"
      - "package-lock.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Check
        run: |
          npm ci
          npm run qa

      - name: Deploy to Cloudflare
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.156.0 deploy

      - name: Smoke test
        run: |
          curl -fsS https://obsisync-api.mediclarity-voice-agent.workers.dev/v1/health
